<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a1f">
<meta name="description" content="Fußball-Manager von der Champions League bis zur Kreisliga">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fußball-Pyramide">
<title>Fußball-Pyramide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<header class="top">
  <button class="ib" data-act="ov:nav" aria-label="Menü öffnen"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="brand tlink" data-act="area:home"><b>Fußball-Pyramide</b></button>
  <div class="clock"><b id="cSeason">2026/27</b><span id="cRound">Spieltag 0</span></div>
  <div class="simc">
    <button class="btn pri" id="bNext" title="Nächster Spieltag"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><span>Spieltag</span></button>
    <button class="btn" id="bTen" title="5 Spieltage">+5</button>
    <button class="btn" id="bAll" title="Saison zu Ende simulieren"><svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM13 5l8 7-8 7z"/></svg><span>Saison</span></button>
    <button class="btn pri" id="bNew" hidden>Neue Saison</button>
  </div>
  <button class="ib" data-act="ov:search" aria-label="Suchen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
</header>
<div class="app">
  <nav class="rail" id="areas" aria-label="Bereiche"></nav>
  <main id="main"></main>
</div>
<div id="ov"></div>
<div class="toast" id="toast" hidden></div>
<script src="src/01-data.js"></script>
<script src="src/02-state.js"></script>
<script src="src/03-schedule.js"></script>
<script src="src/04-sim.js"></script>
<script src="src/05-euro.js"></script>
<script src="src/06-cups.js"></script>
<script src="src/07-squad.js"></script>
<script src="src/08-finance.js"></script>
<script src="src/09-history.js"></script>
<script src="src/10-live.js"></script>
<script src="src/11-season.js"></script>
<script src="src/12-import.js"></script>
<script src="src/13-storage.js"></script>
<script src="src/14-ui-core.js"></script>
<script src="src/15-news.js"></script>
<script src="src/16-ui-pages.js"></script>
<script src="src/pwa.js"></script>
</body>
</html>
